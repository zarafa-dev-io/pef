<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>PEF — Product Engineering Framework</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <meta name="description" content="PEF — le langage commun du Product Engineering augmenté par l'IA">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <!-- surcouche PEF : doit rester APRÈS le thème vue -->
  <link rel="stylesheet" href="pef-theme.css">
</head>
<body>
  <div id="app">Chargement de la documentation…</div>
  <script>
    window.$docsify = {
      name: 'PEF',
      loadSidebar: true,
      themeColor: '#2743D9',
      // Le même menu gauche sur toutes les pages, y compris les sous-répertoires
      // (sans cet alias, Docsify cherche un _sidebar.md par répertoire et le menu
      // disparaît sur les pages des tutoriels).
      alias: { '/.*/_sidebar.md': '/_sidebar.md' },
      // Profondeur des titres de page affichés dans le menu
      subMaxLevel: 2,
      sidebarDisplayLevel: 1,
      auto2top: true,
      search: {
        placeholder: 'Rechercher…',
        noData: 'Aucun résultat',
        depth: 3,
      },
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-sidebar-collapse/dist/docsify-sidebar-collapse.min.js"></script>
</body>
</html>
