# PEF Processor contract (EF-16). Orchestrateur d'accueil : il guide et
# enchaîne les Processors spécialisés, il ne crée aucun Asset lui-même.
processor: StartProject
version: "1.0"
description: >-
  Guide le démarrage d'un projet PEF : diagnostic du dépôt, choix du chemin
  (produit nouveau, ou code existant à rétro-documenter), puis déroulé pas à
  pas des Processors adaptés, revue humaine entre chaque étape.
userInputs:
  - Point de départ (de zéro | code existant) et, selon le cas, notes libres
    ou périmètre de code (workspace multi-root, DEC-006)
outputs:
  - Report
activities:
  - Démarrer un projet
implementation:
  type: copilot-prompt
  path: .github/prompts/start-project.prompt.md
