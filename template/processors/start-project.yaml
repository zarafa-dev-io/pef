# PEF Processor contract (EF-16). Orchestrateur d'accueil : il guide et
# enchaîne les Processors spécialisés. Seule création d'Assets autorisée :
# le plan de rétro-documentation (Epic + UserStories de périmètre), qui porte
# le reste à faire d'une rétro-doc menée en plusieurs sessions.
processor: StartProject
version: "1.1"
description: >-
  Guide le démarrage d'un projet PEF : diagnostic du dépôt, choix du chemin
  (produit nouveau, ou code existant à rétro-documenter), déroulé pas à pas
  des Processors adaptés avec revue humaine entre chaque étape. Sur un code
  volumineux : inventaire, découpage en périmètres, plan de rétro-doc en
  backlog (une UserStory par périmètre, checklist d'avancement), reprise
  session après session jusqu'à épuisement du reste à faire.
userInputs:
  - Point de départ (de zéro | code existant) et, selon le cas, notes libres
    ou périmètre de code (workspace multi-root, DEC-006)
outputs:
  - Report
  - WorkItem   # uniquement le plan de rétro-doc : Epic + US de périmètre
activities:
  - Démarrer un projet
implementation:
  type: copilot-prompt
  path: .github/prompts/start-project.prompt.md
