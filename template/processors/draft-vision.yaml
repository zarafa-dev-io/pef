# PEF Processor contract (EF-16).
processor: DraftVision
version: "1.0"
description: >-
  Structure des notes libres (ateliers, entretiens, idées) en une Vision
  produit et ses Goals mesurables.
userInputs:
  - Notes libres (texte, compte-rendu d'atelier, brief)
inputs:
  - Persona
